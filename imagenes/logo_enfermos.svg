<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C5A73" />
      <stop offset="100%" stop-color="#0D2D3A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0D2D3A" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="94" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)"/>
  
  <!-- Inner Decorative Circle -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  
  <!-- Central Icon Base -->
  <g transform="translate(100, 95)">
    <!-- Heart Background shape -->
    <path d="M 0,-15 C -25,-40 -50,-10 0,35 C 50,-10 25,-40 0,-15 Z" fill="url(#blueGrad)" opacity="0.08"/>
    
    <!-- Cross in Center -->
    <path d="M -6,-28 H 6 V -14 H 20 V -2 H 6 V 26 H -6 V -2 H -20 V -14 H -6 Z" fill="url(#goldGrad)"/>
    
    <!-- Caring Hands Path (stylized arcs) -->
    <path d="M -42,12 C -30,32 -10,38 0,38 C 10,38 30,32 42,12 C 34,22 18,28 0,28 C -18,28 -34,22 -42,12 Z" fill="url(#blueGrad)"/>
    
    <!-- Small Host/Sun Rays above cross -->
    <circle cx="0" cy="-36" r="6" fill="url(#goldGrad)"/>
  </g>
</svg>
